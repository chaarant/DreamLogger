<!DOCTYPE html>
<html>
<head>
    <title>Login - DreamLogger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Login</h1>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>
<p>
    Don't have an account?
    <a href="/signup">Create an account</a>
</p>
    </div>

</div>

</body>
</html>
